<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>良興世界盃預測挑戰</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18222f;
      --muted: #5a6878;
      --line: #dbe3ec;
      --brand: #0d7a58;
      --brand-2: #eb3349;
      --gold: #f2b705;
      --bg: #f6f8fb;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: radial-gradient(circle at top left, rgba(13, 122, 88, .14), transparent 28rem), var(--bg);
      color: var(--ink);
    }
    main { max-width: 1120px; margin: 0 auto; padding: 28px 18px 40px; }
    header {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 20px;
      align-items: end;
      padding: 30px 0 22px;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 60px); line-height: 1; letter-spacing: 0; }
    .lead { color: var(--muted); font-size: 18px; line-height: 1.65; margin: 16px 0 0; }
    .scoreboard {
      background: #102015;
      color: white;
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(16, 32, 21, .18);
    }
    .scoreboard b { display: block; font-size: 14px; color: #9ee0c1; margin-bottom: 10px; }
    .scoreboard span { display: block; font-size: 30px; font-weight: 800; }
    .section-title { margin: 28px 0 14px; font-size: 22px; }
    .form-row {
      display: grid;
      grid-template-columns: minmax(160px, 280px) 1fr;
      gap: 14px;
      align-items: center;
      margin: 18px 0 22px;
    }
    label { font-weight: 800; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px 14px;
      font-size: 16px;
      background: white;
    }
    .matches {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .match {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      min-height: 230px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .meta { color: var(--muted); font-size: 13px; font-weight: 700; text-transform: uppercase; }
    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      font-size: 19px;
      font-weight: 900;
    }
    .team { display: flex; gap: 8px; align-items: center; }
    .team:last-child { justify-content: flex-end; text-align: right; }
    .vs { color: var(--brand-2); font-weight: 950; }
    .pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pick {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 8px;
      background: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    .pick.active { border-color: var(--brand); background: #e8f6ef; color: #07563d; }
    .insight {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 22px 0;
    }
    button.primary, button.secondary {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }
    .primary { background: var(--brand); color: white; }
    .secondary { background: #e8edf3; color: var(--ink); }
    textarea {
      width: 100%;
      min-height: 190px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      line-height: 1.6;
      resize: vertical;
    }
    .ranking {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .rank {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }
    .rank strong { display: block; font-size: 28px; color: var(--brand); }
    .note { color: var(--muted); font-size: 13px; line-height: 1.55; }
    @media (max-width: 760px) {
      header, .form-row, .matches, .ranking { grid-template-columns: 1fr; }
      .teams { font-size: 17px; }
      main { padding: 18px 12px 34px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>良興世界盃預測挑戰</h1>
        <p class="lead">純趣味預測，沒有金流、投注或獎金機制。填姓名、選擇看好的結果，一鍵產生 Telegram 紀錄文字，賽後再回來統計命中率。</p>
      </div>
      <div class="scoreboard">
        <b>小興本輪目標</b>
        <span>4 場預測 / 賽後統計</span>
      </div>
    </header>

    <section>
      <h2 class="section-title">參加者資料</h2>
      <div class="form-row">
        <label for="playerName">姓名必填</label>
        <input id="playerName" placeholder="請輸入姓名或暱稱" required>
      </div>
    </section>

    <section>
      <h2 class="section-title">本輪比賽卡</h2>
      <div class="matches" id="matches"></div>
    </section>

    <section>
      <div class="actions">
        <button class="primary" id="generate">產生 Telegram 預測紀錄</button>
        <button class="secondary" id="copy">複製紀錄</button>
      </div>
      <textarea id="record" readonly placeholder="按下產生後，這裡會出現可貼到 Telegram 群組的預測紀錄。"></textarea>
      <p class="note">第一版使用 Telegram 標準化文字紀錄，避免公開寫入後端資料庫或 Google Sheet 授權卡住。正式統計時可由群組訊息彙整命中率。</p>
    </section>

    <section>
      <h2 class="section-title">賽後命中率統計區</h2>
      <div class="ranking">
        <div class="rank"><strong>0%</strong><span>尚未開賽，等待賽果。</span></div>
        <div class="rank"><strong>0 / 4</strong><span>個人命中場次。</span></div>
        <div class="rank"><strong>待更新</strong><span>排行榜會依 Telegram 紀錄整理。</span></div>
      </div>
    </section>
  </main>

  <script>
    const matches = [
      { id: "m1", time: "Group Stage", home: "🇺🇸 美國", away: "🇲🇽 墨西哥", xing: "小興偏看好主隊不敗", market: "外部看好程度：主隊 42% / 平手 28% / 客隊 30%" },
      { id: "m2", time: "Group Stage", home: "🇧🇷 巴西", away: "🇯🇵 日本", xing: "小興偏看好巴西進攻效率", market: "外部看好程度：主隊 58% / 平手 24% / 客隊 18%" },
      { id: "m3", time: "Group Stage", home: "🇩🇪 德國", away: "🇰🇷 韓國", xing: "小興預測德國控球優勢較大", market: "外部看好程度：主隊 52% / 平手 27% / 客隊 21%" },
      { id: "m4", time: "Group Stage", home: "🇦🇷 阿根廷", away: "🇫🇷 法國", xing: "小興預測五五波，平手機率高", market: "外部看好程度：主隊 34% / 平手 31% / 客隊 35%" }
    ];
    const picks = new Map();
    const labels = { home: "主隊勝", draw: "平手", away: "客隊勝" };
    const root = document.getElementById("matches");

    matches.forEach((match) => {
      const card = document.createElement("article");
      card.className = "match";
      card.innerHTML = `
        <div class="meta">${match.time}</div>
        <div class="teams">
          <div class="team">${match.home}</div>
          <div class="vs">VS</div>
          <div class="team">${match.away}</div>
        </div>
        <div class="pick-grid">
          <button class="pick" data-pick="home">主隊勝</button>
          <button class="pick" data-pick="draw">平手</button>
          <button class="pick" data-pick="away">客隊勝</button>
        </div>
        <div class="insight">${match.xing}<br>${match.market}</div>
      `;
      card.querySelectorAll(".pick").forEach((button) => {
        button.addEventListener("click", () => {
          picks.set(match.id, button.dataset.pick);
          card.querySelectorAll(".pick").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
        });
      });
      root.appendChild(card);
    });

    function buildRecord() {
      const name = document.getElementById("playerName").value.trim();
      if (!name) {
        alert("請先填寫姓名。");
        return "";
      }
      const missing = matches.filter((match) => !picks.has(match.id));
      if (missing.length) {
        alert("請完成 4 場比賽預測。");
        return "";
      }
      const lines = [
        "【良興世界盃預測挑戰】",
        `參加者：${name}`,
        `送出時間：${new Date().toLocaleString("zh-TW", { hour12: false })}`,
        ""
      ];
      matches.forEach((match, index) => {
        lines.push(`${index + 1}. ${match.home} vs ${match.away}：${labels[picks.get(match.id)]}`);
      });
      lines.push("", "備註：純趣味預測，無投注、無金流、無獎金。");
      return lines.join("\n");
    }

    document.getElementById("generate").addEventListener("click", () => {
      const record = buildRecord();
      if (record) document.getElementById("record").value = record;
    });

    document.getElementById("copy").addEventListener("click", async () => {
      const record = document.getElementById("record").value || buildRecord();
      if (!record) return;
      document.getElementById("record").value = record;
      await navigator.clipboard.writeText(record);
      alert("已複製預測紀錄。");
    });
  </script>
</body>
</html>
