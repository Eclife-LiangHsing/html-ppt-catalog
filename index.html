<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>賈維斯超能力</title>
  <meta name="description" content="賈維斯固定主入口：互動式 PPT 目錄與賈維斯技能列表。" />
  <style>
    :root{--bg:#08111f;--panel:#101b31;--card:#16233d;--text:#eef6ff;--muted:#a9bad8;--line:#2b3a5a;--accent:#67d7ff;--accent2:#9d7bff;--good:#77e6aa;--gold:#ffd36b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:radial-gradient(circle at 18% 8%,#254875 0,#08111f 42%,#050812 100%);color:var(--text);display:grid;place-items:center;padding:28px;line-height:1.6}
    .wrap{width:min(1040px,100%)}.hero{margin-bottom:28px}.eyebrow{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.title{font-size:clamp(42px,8vw,86px);letter-spacing:-.06em;line-height:1;margin:12px 0;background:linear-gradient(90deg,#fff,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}.lead{max-width:760px;color:var(--muted);font-size:18px;margin:0}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:34px}.card{min-height:260px;border:1px solid var(--line);border-radius:32px;background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.045));padding:28px;text-decoration:none;color:var(--text);box-shadow:0 24px 70px rgba(0,0,0,.32);display:flex;flex-direction:column;justify-content:space-between;transition:transform .18s ease,border-color .18s ease,background .18s ease}.card:hover{transform:translateY(-5px);border-color:rgba(103,215,255,.75);background:linear-gradient(150deg,rgba(103,215,255,.16),rgba(157,123,255,.08))}.icon{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 34px rgba(103,215,255,.22)}.card h2{font-size:30px;margin:26px 0 8px;line-height:1.2}.card p{color:var(--muted);margin:0}.go{margin-top:24px;color:#07101c;background:linear-gradient(90deg,var(--accent),var(--good));display:inline-flex;align-self:flex-start;border-radius:999px;padding:10px 16px;font-weight:900}.footer{margin-top:28px;color:#8394b8;font-size:14px;border-top:1px solid var(--line);padding-top:18px}.footer a{color:var(--accent)}
    @media (max-width:760px){body{padding:20px}.grid{grid-template-columns:1fr}.card{min-height:220px}.card h2{font-size:26px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Jarvis Superpowers</div>
      <h1 class="title">賈維斯超能力</h1>
      <p class="lead">這裡是固定主入口。之後我更新互動式 HTML PPT 或賈維斯技能列表時，都會附這一頁給你，避免連結分散。</p>
    </section>
    <section class="grid" aria-label="主功能入口">
      <a class="card" href="./ppt-catalog/">
        <div><div class="icon">🎞️</div><h2>互動式 PPT</h2><p>所有 HTML 投影片的主目錄列表。排序規則：最新產生 / 更新的簡報在最上面，往下由新到舊。</p></div>
        <span class="go">進入 PPT 主目錄</span>
      </a>
      <a class="card" href="https://eclife-lianghsing.github.io/jarvis-skills-catalog/">
        <div><div class="icon">🧰</div><h2>賈維斯技能</h2><p>查看目前可用、已安裝與未來可能補強的賈維斯技能清單，每個技能都有中文說明。</p></div>
        <span class="go">查看技能列表</span>
      </a>
    </section>
    <div class="footer">固定主網頁：<a href="https://eclife-lianghsing.github.io/html-ppt-catalog/">https://eclife-lianghsing.github.io/html-ppt-catalog/</a></div>
  </main>
</body>
</html>
