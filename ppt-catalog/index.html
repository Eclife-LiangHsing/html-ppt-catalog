<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>賈維斯 HTML PPT 作品總表</title>
  <meta name="description" content="固定收錄賈維斯協助產出的 HTML PPT / GitHub Pages 投影片連結。" />
  <style>
    :root{--bg:#0b1020;--panel:#111a33;--card:#17213d;--text:#edf3ff;--muted:#9fb0d0;--line:#293657;--accent:#64d2ff;--accent2:#9d7bff;--good:#66e3a3}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:radial-gradient(circle at top left,#20345f 0,#0b1020 38%,#070a14 100%);color:var(--text);line-height:1.6}
    header{padding:56px 20px 28px;max-width:1120px;margin:auto} .eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
    h1{font-size:clamp(32px,6vw,64px);line-height:1.05;margin:12px 0 16px;letter-spacing:-.04em}.lead{font-size:18px;color:var(--muted);max-width:760px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.05);padding:8px 12px;border-radius:999px;color:#dbe7ff}
    main{max-width:1120px;margin:auto;padding:0 20px 56px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px 14px;font-size:15px;min-width:220px}.toolbar select option{color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.045));border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}.tag{color:#06101d;background:linear-gradient(90deg,var(--accent),var(--good));padding:3px 9px;border-radius:999px;font-weight:800}.card h2{font-size:22px;line-height:1.25;margin:16px 0 6px}.case-note{color:#aebfe0;font-size:13px;margin:0 0 12px;line-height:1.45}.desc{color:#d4def5}.source{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{display:inline-flex;flex-direction:column;gap:2px;text-decoration:none;color:#07101c;background:linear-gradient(90deg,var(--accent),var(--accent2));font-weight:800;padding:9px 14px;border-radius:14px;line-height:1.2}.btn .btn-main{font-size:15px}.btn .btn-hint{font-size:11px;font-weight:700;opacity:.76}.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.secondary .btn-hint{color:var(--muted);opacity:1}footer{color:var(--muted);border-top:1px solid var(--line);padding:24px 0;margin-top:36px;font-size:14px}.empty{display:none;color:var(--muted);padding:24px;border:1px dashed var(--line);border-radius:18px}
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">HTML PPT Catalog</div>
    <h1>賈維斯 HTML PPT 作品總表</h1>
    <p class="lead">這是一個固定入口頁，集中收錄已發佈到 GitHub Pages 的 HTML 投影片。之後新增或更新簡報時，會持續加到這裡，避免連結散落。</p>
    <div class="stats"><span class="pill">總數：<b id="total">0</b> 份</span><span class="pill">最後更新：2026-05-15</span><span class="pill">GitHub Pages：Eclife-LiangHsing</span></div>
  </header>
  <main>
    <div class="toolbar"><input id="q" placeholder="搜尋名稱、簡介、來源…" /><select id="cat"><option value="">全部分類</option></select></div>
    <section id="grid" class="grid"></section><div id="empty" class="empty">沒有符合條件的項目。</div>
    <footer>資料來源欄位採公開安全描述；不在總表公開 API keys、token、私人網址或機密內容。</footer>
  </main>
<script>
const items = [
  {slug:"bnext-space-intelligence-html-ppt-visual",name:"李飛飛空間智慧｜圖文版 HTML PPT",desc:"以圖文視覺方式整理李飛飛空間智慧相關主題，適合作為趨勢介紹與簡報展示版本。",source:"Jason / OpenClaw 產出之 HTML PPT；公開 GitHub Pages 頁面驗證整理。",date:"2026-05-15",category:"AI 趨勢",url:"https://eclife-lianghsing.github.io/bnext-space-intelligence-html-ppt-visual/",zip_url:"https://drive.google.com/file/d/13uwKHKGMj7lH5uVB2Dw5bsDgGSHF6nnb/view?usp=sharing",note:"圖文展示版｜最新完整版本，適合快速對外簡報與現場說明"},
  {slug:"liangxing-omnichannel-html-ppt-visual",name:"良興全通路轉型個案｜圖文版 HTML PPT",desc:"以更視覺化的方式呈現良興全通路轉型個案，適合對外展示與快速瀏覽。",source:"Jason / OpenClaw 產出之 HTML PPT；公開 GitHub Pages 頁面驗證整理。",date:"2026-05-15",category:"企業個案",url:"https://eclife-lianghsing.github.io/liangxing-omnichannel-html-ppt-visual/",zip_url:"https://drive.google.com/file/d/1LbnbaNw1jUtc46OaRlCXphCLY3vT45Up/view?usp=sharing",note:"圖文案例版｜最新完整版本，適合客戶展示、快速瀏覽與提案開場"}
];
const grid=document.querySelector('#grid'), q=document.querySelector('#q'), cat=document.querySelector('#cat'), empty=document.querySelector('#empty');document.querySelector('#total').textContent=items.length;[...new Set(items.map(x=>x.category))].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cat.appendChild(o)});
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){const term=q.value.trim().toLowerCase(), c=cat.value;const shown=items.filter(x=>(!c||x.category===c)&&[x.name,x.note,x.desc,x.source,x.category].join(' ').toLowerCase().includes(term));grid.innerHTML=shown.map(x=>`<article class="card"><div class="meta"><span class="tag">${esc(x.category)}</span><time>${esc(x.date)}</time></div><h2>${esc(x.name)}</h2><p class="case-note">${esc(x.note||'用途說明待補')}</p><p class="desc">${esc(x.desc)}</p><p class="source"><b>資料來源：</b>${esc(x.source)}</p><div class="actions"><a class="btn" href="${esc(x.url)}"><span class="btn-main">打開 HTML PPT</span><span class="btn-hint">線上瀏覽簡報</span></a>${x.zip_url?`<a class="btn secondary" href="${esc(x.zip_url)}"><span class="btn-main">ZIP 下載</span><span class="btn-hint">離線交付檔案</span></a>`:`<span class="btn secondary" aria-disabled="true"><span class="btn-main">ZIP 待補</span><span class="btn-hint">Drive 連結建立後補上</span></span>`}</div></article>`).join('');empty.style.display=shown.length?'none':'block'}
q.addEventListener('input',render);cat.addEventListener('change',render);render();
</script>
</body>
</html>
