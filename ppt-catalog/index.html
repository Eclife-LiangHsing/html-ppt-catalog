<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HTML PPT 作品總表</title>
  <style>
    :root{--ink:#102033;--muted:#64748b;--line:rgba(15,23,42,.14);--shadow:0 24px 70px rgba(15,23,42,.12)}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(135deg,#fff,#eefaff 68%,#f7fbff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',Arial,sans-serif;line-height:1.6}
    .wrap{max-width:1180px;margin:0 auto;padding:38px 20px 80px}
    .home{display:inline-flex;text-decoration:none;color:#075985;background:#e0f2fe;border:1px solid #bae6fd;border-radius:999px;padding:9px 13px;font-weight:800}
    h1{font-size:clamp(34px,6vw,66px);line-height:1.03;margin:16px 0}
    .lead{font-size:19px;color:#40536b;max-width:900px}
    .stats,.chips,.actions{display:flex;gap:10px;flex-wrap:wrap}
    .stat,.card{background:rgba(255,255,255,.9);border:1px solid var(--line);box-shadow:var(--shadow)}
    .stat{border-radius:14px;padding:14px 16px}.stat b{font-size:28px}.stat span{display:block;color:var(--muted);font-size:13px}
    .tools{display:grid;grid-template-columns:1fr auto;gap:14px;margin:24px 0}
    .search{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;background:#fff}
    .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;font-weight:800;cursor:pointer}
    .chip.active{background:#0f172a;color:white}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .card{border-radius:18px;padding:22px}.meta{display:flex;justify-content:space-between;color:#64748b;font-size:13px;font-weight:900}
    .meta span{color:#0369a1}.card h2{font-size:24px;margin:12px 0 10px;line-height:1.25}
    .desc,.source{color:#475569}.source{font-size:14px;color:#64748b}
    .actions a{text-decoration:none;border-radius:999px;padding:10px 14px;font-weight:900}.open{background:#0f172a;color:#fff}.zip{background:#e0f2fe;color:#075985}.sub{background:#fef3c7;color:#92400e}
    code{color:#64748b;font-size:12px}
    @media(max-width:820px){.tools,.grid{grid-template-columns:1fr}.wrap{padding:28px 14px 60px}}
  </style>
</head>
<body>
  <main class="wrap">
    <a class="home" href="../">返回入口</a>
    <section>
      <div style="color:#0f766e;font-weight:900">HTML PPT Catalog</div>
      <h1>HTML PPT 作品總表</h1>
      <p class="lead">公開展示用作品清單。公開影片、公開網頁與公開資料整理可以放 GitHub Pages；含公司員工姓名、排班、業績或內部營運資料的檔案只放 Google Drive。</p>
      <div class="stats">
        <div class="stat"><b id="workCount">0</b><span>已登錄作品</span></div>
        <div class="stat"><b id="catCount">0</b><span>分類</span></div>
        <div class="stat"><b>Public only</b><span>公開展示層</span></div>
      </div>
    </section>
    <section class="tools">
      <input id="q" class="search" placeholder="搜尋名稱、描述或資料來源">
      <div class="chips" id="chips"></div>
    </section>
    <section class="grid" id="grid"></section>
  </main>
  <script>
    const grid=document.getElementById('grid');
    const chips=document.getElementById('chips');
    const q=document.getElementById('q');
    let items=[], cat='全部';
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function card(item){
      const text=[item.name,item.desc,item.source,item.category,item.note].join(' ');
      return `<article class="card" data-cat="${esc(item.category)}" data-name="${esc(text)}">
        <div class="meta"><span>${esc(item.category)}</span><time>${esc(item.date)}</time></div>
        <h2>${esc(item.name)}</h2>
        <p class="desc">${esc(item.desc)}</p>
        <p class="source"><b>資料來源：</b>${esc(item.source)}</p>
        <div class="actions">
          <a class="open" href="${esc(item.url)}" target="_blank" rel="noopener">打開 HTML PPT</a>
          ${item.infographic_url?`<a class="sub" href="${esc(item.infographic_url)}" target="_blank" rel="noopener">資訊圖表</a>`:''}
          ${item.zip_url?`<a class="zip" href="${esc(item.zip_url)}" target="_blank" rel="noopener">ZIP 下載</a>`:''}
          <code>/${esc(item.slug)}/</code>
        </div>
      </article>`;
    }
    function render(){
      const s=q.value.trim().toLowerCase();
      grid.innerHTML=items.filter(item=>(cat==='全部'||item.category===cat)&&(!s||[item.name,item.desc,item.source,item.category,item.note].join(' ').toLowerCase().includes(s))).map(card).join('');
    }
    function setChips(categories){
      chips.innerHTML=['全部',...categories].map((c,i)=>`<button class="chip ${i?'':'active'}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
      chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;render();});
    }
    fetch('catalog.json').then(r=>r.json()).then(data=>{
      items=data;
      const categories=[...new Set(items.map(x=>x.category))];
      document.getElementById('workCount').textContent=items.length;
      document.getElementById('catCount').textContent=categories.length;
      setChips(categories);
      render();
    });
    q.oninput=render;
  </script>
</body>
</html>
