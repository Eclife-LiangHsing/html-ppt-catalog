<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>良興採購儀錶板｜已改為內部交付</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #243142;
      --muted: #657286;
      --line: #dfe6ef;
      --blue: #0b5b9d;
      --bg: #f5f8fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Arial, sans-serif;
    }

    main {
      width: min(720px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(36, 49, 66, .08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 15px;
    }

    strong {
      color: var(--blue);
    }
  </style>
</head>
<body>
  <main>
    <h1>此儀錶板已改為內部離線交付</h1>
    <p>這份採購銷售與庫存儀錶板使用公司內部資料，已不再透過公開 GitHub Pages 提供。</p>
    <p><strong>請改用 Google Drive 內部下載版本。</strong></p>
  </main>
</body>
</html>
